name: Multi-device feasibility (experimental)

on:
  pull_request:
    paths:
      - 'experiments/multidevice/**'
      - 'src/services/devices/**'
      - 'src/pages/LinkDevice.tsx'
      - 'src/components/settings/LinkedDevices.tsx'
      - '.github/workflows/multidevice-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/multidevice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/multidevice/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser lifecycle test
        run: |
          npm run dev > "$RUNNER_TEMP/seal-device-lab.log" 2>&1 &
          node browser-smoke.cjs

  app-device-link:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix experiments/multidevice --ignore-scripts
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: experiments/multidevice
      - name: Real app and relay device-link lifecycle
        run: |
          npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/seal-app.log" 2>&1 &
          node experiments/multidevice/app-browser-smoke.cjs
